<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SetuSight Smart Bridge Platform</title>
<meta name="description" content="SetuSight Platform Access — Secure Role-Based Login">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
<link rel="stylesheet" href="app.css">
<style>
  .login-wrapper {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: var(--bg);
  }
  .login-box {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    padding: 36px 32px;
    box-shadow: var(--shadow-card);
  }
  .login-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    justify-content: center;
  }
  .back-home {
    margin-top: 20px;
    font-size: 0.84rem;
    color: var(--navy-soft);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .back-home:hover { color: var(--navy); }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-box">
    <div class="login-brand">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 26L12 14L20 22L28 10L36 26" stroke="#1F7A4D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 26H36" stroke="#10233D" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="12" cy="14" r="2" fill="#1F7A4D"/>
        <circle cx="28" cy="10" r="2" fill="#1F7A4D"/>
      </svg>
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 800; line-height: 1;">SETUSIGHT</h2>
        <span style="font-size: 0.7rem; color: var(--navy-faint); font-family: var(--font-mono);">Government &amp; Asset Portal</span>
      </div>
    </div>

    <p style="font-size: 0.88rem; color: var(--navy-soft); margin-bottom: 24px; text-align: center;">
      Sign in to manage bridge inventory, view inspection records, and track maintenance.
    </p>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Official Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="e.g. admin@setusight.gov.in" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn btn--primary" style="width: 100%; margin-top: 12px;">
        Sign In to Portal <span class="arrow">→</span>
      </button>
    </form>

    <!-- DIRECT ONE-CLICK ROLE SIGN-IN -->
    <div class="demo-pills" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);">
      <div style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--navy-faint); font-weight: 700; margin-bottom: 12px; text-align: center; font-family: var(--font-mono);">
        ⚡ Instant Role Sign-In (1-Click Auto Login)
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
        <button type="button" class="btn btn--ghost btn--sm" onclick="loginDirectly('admin@setusight.gov.in', 'admin123', 'admin')" style="padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: var(--radius-s); background: var(--bg-alt); text-align: center;">
          <span style="font-size: 1.15rem;">🛡️</span>
          <span style="font-weight: 700; font-size: 0.82rem; color: var(--navy);">Admin</span>
          <span style="font-size: 0.65rem; color: var(--navy-faint); font-family: var(--font-mono);">PWD Authority</span>
        </button>
        <button type="button" class="btn btn--ghost btn--sm" onclick="loginDirectly('inspector@setusight.gov.in', 'inspect123', 'inspector')" style="padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: var(--radius-s); background: var(--bg-alt); text-align: center;">
          <span style="font-size: 1.15rem;">🔍</span>
          <span style="font-weight: 700; font-size: 0.82rem; color: var(--navy);">Inspector</span>
          <span style="font-size: 0.65rem; color: var(--navy-faint); font-family: var(--font-mono);">Field Inspection</span>
        </button>
        <button type="button" class="btn btn--ghost btn--sm" onclick="loginDirectly('contractor@setusight.gov.in', 'contract123', 'contractor')" style="padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: var(--radius-s); background: var(--bg-alt); text-align: center;">
          <span style="font-size: 1.15rem;">🏗️</span>
          <span style="font-weight: 700; font-size: 0.82rem; color: var(--navy);">Contractor</span>
          <span style="font-size: 0.65rem; color: var(--navy-faint); font-family: var(--font-mono);">Repairs &amp; Orders</span>
        </button>
      </div>
    </div>

  </div>

  <a href="/" class="back-home">
    ← Back to Public Landing Page
  </a>
</div>

<script src="app.js"></script>
<script>
  async function loginDirectly(email, password, roleLabel) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = `Signing in as ${roleLabel ? roleLabel.toUpperCase() : 'User'}...`;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok || !data.success) {
        throw new Error(data.error || 'Authentication failed');
      }

      SetuApp.setSession(data.token, data.user);
      SetuApp.showToast(`Welcome back, ${data.user.name} (${data.user.role.toUpperCase()})`, 'success');

      setTimeout(() => {
        if (data.user.role === 'admin') window.location.href = '/admin';
        else if (data.user.role === 'inspector') window.location.href = '/inspector';
        else if (data.user.role === 'contractor') window.location.href = '/contractor';
        else window.location.href = '/';
      }, 300);
    } catch (err) {
      SetuApp.showToast(err.message, 'error');
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Sign In to Portal <span class="arrow">→</span>';
    }
  }

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    loginDirectly(email, password);
  });

  // Check URL param ?role=admin etc. for instant one-click login from external links
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const roleParam = params.get('role');
    if (roleParam === 'admin') loginDirectly('admin@setusight.gov.in', 'admin123', 'admin');
    else if (roleParam === 'inspector') loginDirectly('inspector@setusight.gov.in', 'inspect123', 'inspector');
    else if (roleParam === 'contractor') loginDirectly('contractor@setusight.gov.in', 'contract123', 'contractor');
  });
</script>
</body>
</html>
